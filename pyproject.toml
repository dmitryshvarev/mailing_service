[project]
name = "mailing-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Dmitry Shvarev",email = "dima.dreadman@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "django-countries (>=9.1.0,<10.0.0)",
    "pillow (>=13.0.0,<14.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.10.1,<27.0.0)"
]


[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.git
    | \.mypy_cache
    | \.venv
  )/
)
'''


[tool.poetry]
package-mode = false
